spring.application.name=terraflow

# Realtime Database. Put the real values here, or better, override them with
# environment variables (FIREBASE_DATABASE_URL / FIREBASE_CREDENTIALS_PATH)
# so the service account path/URL aren't hardcoded in source control.
firebase.database-url=https://terraflow-fa008-default-rtdb.asia-southeast1.firebasedatabase.app/
firebase.credentials-path=classpath:firebase-service-account.json
server.forward-headers-strategy=framework
spring.thymeleaf.cache=false

server.port=8080
